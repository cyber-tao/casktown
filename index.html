<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="/sprites/environment/misc/barrel.png">
  <title>木桶镇 / CaskTown</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #game-container {
      width: min(1920px, 100dvw, calc(100dvh * 16 / 9));
      height: min(1080px, 100dvh, calc(100dvw * 9 / 16));
      aspect-ratio: 16 / 9;
      background: #07101a url('/sprites/loading_bg_1080p.jpg') center / cover no-repeat;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      touch-action: none;
    }
    #startup-loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: #07101a url('/sprites/loading_bg_1080p.jpg') center / cover no-repeat;
      color: #eef6f3;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }
    #startup-loading::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(2, 5, 10, 0.46);
    }
    .startup-loading__content {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 18px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.72);
    }
    .startup-loading__title {
      margin: 0;
      color: #f6d78b;
      font: 700 clamp(34px, 5vw, 72px)/1.1 "Songti SC", "STSong", serif;
    }
    .startup-loading__label {
      font-size: clamp(15px, 1.6vw, 22px);
    }
    .startup-loading__spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(143, 214, 207, 0.22);
      border-top-color: #f1c46a;
      border-radius: 50%;
      animation: startup-spin 0.9s linear infinite;
    }
    @keyframes startup-spin {
      to {
        transform: rotate(360deg);
      }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .orientation-notice {
      display: none;
    }
    @media (orientation: portrait) and (max-width: 768px) {
      #game-container {
        filter: blur(2px);
        opacity: 0.35;
      }
      .orientation-notice {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
        color: #eef6f3;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        text-align: center;
        background: #07101a url('/sprites/loading_bg_1080p.jpg') center / cover no-repeat;
        z-index: 30;
      }
      .orientation-notice::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(2, 5, 10, 0.68);
      }
      .orientation-notice__content {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 14px;
        max-width: 320px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.75);
      }
      .orientation-notice__device {
        position: relative;
        width: 62px;
        height: 98px;
        border: 3px solid rgba(241,196,106,0.92);
        border-radius: 12px;
        box-shadow: inset 0 0 0 2px rgba(7,16,26,0.58), 0 8px 30px rgba(0,0,0,0.34);
        transform: rotate(90deg);
      }
      .orientation-notice__device::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 7px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(241,196,106,0.9);
        transform: translateX(-50%);
      }
      .orientation-notice__title {
        margin: 0;
        color: #f6d78b;
        font: 700 clamp(30px, 10vw, 44px)/1.1 "Songti SC", "STSong", serif;
      }
      .orientation-notice__label {
        margin: 0;
        font: 700 clamp(18px, 5.4vw, 22px)/1.35 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      }
      .orientation-notice__hint {
        margin: 0;
        max-width: 14em;
        color: #cfe5df;
        font: 500 clamp(13px, 3.9vw, 16px)/1.5 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="startup-loading" aria-live="polite">
    <div class="startup-loading__content">
      <h1 class="startup-loading__title">木桶镇</h1>
      <div class="startup-loading__label">正在进入木桶镇</div>
      <div class="startup-loading__spinner" aria-hidden="true"></div>
    </div>
  </div>
  <div class="orientation-notice" role="status" aria-live="polite">
    <div class="orientation-notice__content">
      <div class="orientation-notice__device" aria-hidden="true"></div>
      <h1 class="orientation-notice__title">木桶镇</h1>
      <p class="orientation-notice__label">请横屏进入 CaskTown</p>
      <p class="orientation-notice__hint">旋转设备后会自动继续</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
